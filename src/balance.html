<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balance Page</title>
    <style>
        .back-button {
            position: absolute;
            top: 20px; 
            left: 20px; 
            padding: 15px 25px; 
            background-color: #f2f2f2;
            color: rgb(0, 0, 0);
            text-decoration: none;
            border-radius: 5px;
            border: 2px solid #000000; 
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        .balance-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .rectangle {
            width: 600px;
            height: 300px;
            border: 2px solid #000;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            border-radius: 15px;
        }
        .balance-amount {
            font-size: 36px; /* Increased font size */
            padding: 10px 20px;
            border: 2px solid #000;
            background-color: #f2f2f2;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <a href="main.html" class="back-button">Back</a>
    <div class="balance-container">
        <h1>Balance</h1>
        <div class="rectangle">
            <div class="balance-amount">$2,476,239</div>
        </div>
    </div>
</body>
</html>
