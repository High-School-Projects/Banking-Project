<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="""UTF-8">
    <meta name="""viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions Page</title>
    <style>
        .back-button {
            position: absolute;
            top: 20px; 
            left: 20px; 
            padding: 15px 25px; 
            background-color: #f2f2f2;
            color: rgb(0, 0, 0);
            text-decoration: none;
            border-radius: 5px;
            border: 2px solid #000000;
        }
        .center-buttons {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .transaction-button {
            padding: 25px 45px;
            font-size: 20px;
            background-color: #f2f2f2;
            color: rgb(0, 0, 0);
            text-decoration: none;
            border-radius: 5px;
            border: 1.5px solid #000000;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <a href="main.html" class="back-button">Back</a>
    <div class="center-buttons">
        <a href="withdraw.html" class="transaction-button">Expense</a>
        <a href="deposit.html" class="transaction-button">Deposit</a>
    </div>
</body>
</html>
