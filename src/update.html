<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Update Page</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        table {
            width: 80%;
            border-collapse: collapse;
        }
        th, td {
            padding: 15px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
        .no-border {
            border: none;
        }
        .no-border button {
            font-size: 16px; /* Increase button font size */
            padding: 10px 20px; /* Increase button padding */
            border: 2px solid #000000; /* Add button border */
            background-color: #f2f2f2; /* Add background color */
            color: rgb(0, 0, 0); /* Add text color */
            border-radius: 5px; /* Add rounded corners */
        }
        .no-border {
            border: none; /* Remove border from last column cells */
        }
        .back-button {
            position: absolute;
            top: 20px; /* Shift down */
            left: 20px; /* Shift to the right */
            padding: 15px 25px; /* Increase padding to make it bigger */
            background-color: #f2f2f2;
            color: rgb(0, 0, 0);
            text-decoration: none;
            border-radius: 5px;
            border: 2px solid #000000; /* Add black border */
        }
    </style>
</head>
